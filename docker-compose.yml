# BunMail — Docker Compose
#
# Services:
#   app      BunMail (REST API, dashboard, inbound SMTP :25, submission :587)
#   db       PostgreSQL — shared by BunMail AND Dovecot (mailbox auth)
#   dovecot  IMAP (:993 TLS, :143 STARTTLS) + LMTP (private) — IMAP mailboxes
#   acme     Let's Encrypt (DNS-01 via Cloudflare) for the mail hostnames
#
# Usage: docker compose up -d
# The app waits for PostgreSQL to be healthy before starting, then
# automatically runs database migrations on boot. Dovecot reads the
# `mailboxes` table those migrations create.
#
# Set POSTGRES_PASSWORD (and the ACME/Cloudflare vars) in your .env.
# Never commit real credentials to version control. See docs/mailboxes.md.

services:
  app:
    build: .
    # HTTP (API + dashboard) is reached through your reverse proxy
    # (Coolify/Traefik). It is deliberately NOT published on the host here;
    # docker-compose.override.yml publishes it for local development.
    expose:
      - "${PORT:-3000}"
    ports:
      # Inbound SMTP (MX) is published by the `smtp-tls` service below, which
      # terminates STARTTLS and relays here with the PROXY protocol. The
      # receiver itself is only reachable on the private network.
      # SMTP submission over implicit TLS (SMTPS, RFC 8314) — apps and
      # mailbox users sending THROUGH BunMail. Requires
      # SMTP_SUBMISSION_ENABLED=true; the cert comes from the acme sidecar.
      - "${SMTP_SUBMISSION_TLS_PORT:-465}:${SMTP_SUBMISSION_TLS_PORT:-465}"
      # The plaintext submission port (587) is NOT published: it cannot
      # offer STARTTLS under Bun, so it only makes sense for apps on the
      # private Docker network with SMTP_SUBMISSION_ALLOW_INSECURE=true.
      # - "${SMTP_SUBMISSION_PORT:-587}:${SMTP_SUBMISSION_PORT:-587}"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bunmail}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-bunmail}
      BUNMAIL_ENV: production
      # Inbound connections arrive via the smtp-tls front with a PROXY header
      SMTP_PROXY_PROTOCOL: "true"
      # Dovecot LMTP on the private network (docs/mailboxes.md)
      MAILBOX_LMTP_HOST: dovecot
      MAILBOX_LMTP_PORT: "24"
      # Let's Encrypt cert from the acme sidecar → STARTTLS on :587
      SMTP_SUBMISSION_TLS_CERT: /certs/fullchain.pem
      SMTP_SUBMISSION_TLS_KEY: /certs/privkey.pem
    volumes:
      - certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      acme:
        condition: service_healthy
      dovecot:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bunmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bunmail}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bunmail}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  smtp-tls:
    # STARTTLS front for port 25 (see smtp-tls/proxy.py). Bun cannot upgrade a
    # socket to TLS server-side, so opportunistic TLS for incoming mail is
    # terminated here and relayed in cleartext on the private network with
    # the PROXY protocol, keeping the real client IP for BunMail's checks.
    build: ./smtp-tls
    ports:
      - "${SMTP_PORT:-25}:2525"
    environment:
      LISTEN_PORT: "2525"
      BACKEND_HOST: app
      BACKEND_PORT: ${SMTP_PORT:-25}
      CERT_FILE: /certs/fullchain.pem
      KEY_FILE: /certs/privkey.pem
      PROXY_PROTOCOL: "true"
    volumes:
      - certs:/certs:ro
    depends_on:
      app:
        condition: service_healthy
      acme:
        condition: service_healthy
    restart: unless-stopped

  dovecot:
    build: ./dovecot
    ports:
      - "${IMAPS_PORT:-993}:993"
      - "${IMAP_PORT:-143}:143"
      # LMTP (:24) is intentionally NOT published — private network only.
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-bunmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bunmail}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-localhost}
      CERT_DIR: /certs
    volumes:
      - maildata:/var/mail
      - certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      acme:
        condition: service_healthy
    restart: unless-stopped

  acme:
    build: ./acme
    environment:
      # Space-separated hostnames; the first is the certificate CN.
      ACME_DOMAINS: ${ACME_DOMAINS:-${MAIL_HOSTNAME:-localhost}}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env (Let's Encrypt account)}
      ACME_STAGING: ${ACME_STAGING:-false}
      # Cloudflare API token with Zone:DNS:Edit on the zone (DNS-01)
      CF_Token: ${CF_DNS_API_TOKEN:?Set CF_DNS_API_TOKEN in .env}
      CF_Zone_ID: ${CF_ZONE_ID:-}
      CF_Account_ID: ${CF_ACCOUNT_ID:-}
      CERT_DIR: /certs
    volumes:
      - acme:/acme.sh
      - certs:/certs
    healthcheck:
      # Healthy as soon as a (placeholder or real) cert pair exists, so
      # dependants can boot; they reload when the real cert lands.
      test: ["CMD-SHELL", "test -s /certs/fullchain.pem && test -s /certs/privkey.pem"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  # Maildir storage for every mailbox — MUST be persistent.
  maildata:
  # Let's Encrypt cert pair shared by dovecot (IMAPS) and app (STARTTLS).
  certs:
  # acme.sh account + issued certs (so renewals don't re-register).
  acme:
