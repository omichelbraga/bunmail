# ───────────────────────────────────────────────────────
# BunMail — Dovecot 2.3 configuration
#
# Single-file config. Everything environment-specific (DB credentials,
# hostname) is rendered into dovecot-sql.conf.ext by entrypoint.sh.
# ───────────────────────────────────────────────────────

protocols = imap lmtp
listen = *, ::

# Logs go to the container's stdout/stderr (Coolify / docker logs).
log_path = /dev/stderr
info_log_path = /dev/stdout
auth_verbose = yes
auth_verbose_passwords = no
mail_debug = no

# ── Storage ──
# Maildir per mailbox: /var/mail/<domain>/<local-part>/Maildir
# %d = domain, %n = local part (from the SQL userdb `user`)
mail_location = maildir:/var/mail/%d/%n/Maildir
mail_home = /var/mail/%d/%n
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
mail_privileged_group = vmail
# Multi-device users (phone + laptop + webmail) open many sessions.
mail_max_userip_connections = 25

# ── Authentication ──
# Usernames are full addresses (user@domain). Dovecot looks them up in
# BunMail's Postgres — see dovecot-sql.conf.ext.
auth_mechanisms = plain login
auth_username_format = %Lu
disable_plaintext_auth = yes

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# ── TLS ──
# Certificates are provided by the `acme` sidecar (Let's Encrypt, DNS-01)
# on a shared volume; entrypoint.sh installs a temporary self-signed pair
# until the real one lands and reloads Dovecot when it changes.
ssl = required
ssl_cert = </etc/dovecot/certs/fullchain.pem
ssl_key = </etc/dovecot/certs/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes
ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384

# ── Services ──
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service lmtp {
  # LMTP is only reachable from the Docker network (BunMail app). Never
  # publish this port on the host.
  inet_listener lmtp {
    port = 24
  }
}

service auth {
  unix_listener auth-userdb {
    mode = 0660
    user = vmail
    group = vmail
  }
}

service auth-worker {
  # SQL lookups run in auth-worker; drop root since we don't read shadow.
  user = $default_internal_user
}

# ── Mailbox layout ──
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# ── Quota ──
# Per-mailbox limit comes from the SQL userdb (`quota_rule` column →
# `*:bytes=<mailboxes.quota_bytes>`). maildir backend keeps the count in
# each Maildir's `maildirsize` file — no extra dictionary service needed.
mail_plugins = $mail_plugins quota

plugin {
  quota = maildir:User quota
  quota_rule = *:storage=1G
  quota_rule2 = Trash:storage=+10%%
  quota_grace = 10%%
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "552 5.2.2 Mailbox is full"
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota
  imap_idle_notify_interval = 2 mins
}

protocol lmtp {
  mail_plugins = $mail_plugins
  # Reject over-quota deliveries at RCPT time so BunMail can return a
  # meaningful SMTP error instead of accepting and then bouncing.
  postmaster_address = postmaster@%d
}

lmtp_rcpt_check_quota = yes
lmtp_save_to_detail_mailbox = no
